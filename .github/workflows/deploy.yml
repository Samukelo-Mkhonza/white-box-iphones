name: Deploy

# Runs after CI succeeds on main, so a broken build is never deployed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The build runs remotely on Vercel, not on this runner. App env vars
      # (TURSO_DATABASE_URL, AUTH_SECRET, PAYFAST_*, etc.) live in the Vercel
      # project's settings and are only readable inside Vercel's build
      # infrastructure - pulling them onto a GitHub runner yields empty
      # values, which is why a runner-side `vercel build` cannot work here.
      # Production reads/writes go to Turso (see lib/prisma.ts) since
      # Vercel's filesystem is read-only/ephemeral and can't hold a local
      # SQLite file. Auto-deploys of main via the Vercel Git integration are
      # disabled in vercel.json so this workflow is the only production
      # deploy path.
      - name: Deploy
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
